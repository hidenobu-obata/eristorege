<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>えりのすとれーじ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf2f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #ff69b4;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .drop-zone {
            border: 2px dashed #ffb6c1;
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            transition: background 0.3s;
            background-color: #fff9fa;
            margin-bottom: 20px;
        }
        .drop-zone:hover {
            background-color: #ffe4e1;
        }
        .drop-zone p {
            margin: 0 0 15px 0;
            color: #666;
            font-size: 14px;
        }
        /* ファイル選択ボタンのデザイン */
        .select-btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .select-btn:hover {
            background-color: #ff1493;
        }
        /* 隠しファイルインプット */
        #fileInput {
            display: none;
        }
        .password-container {
            margin-bottom: 20px;
            text-align: left;
        }
        .password-container label {
            font-size: 13px;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }
        .password-container input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        #uploadBtn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        #uploadBtn:disabled {
            background-color: #ffc0cb;
            cursor: not-allowed;
        }
        #progressContainer {
            display: none;
            margin-top: 15px;
        }
        progress {
            width: 100%;
            height: 16px;
            accent-color: #ff69b4;
        }
        #resultArea {
            margin-top: 20px;
            word-break: break-all;
        }
        #resultArea a {
            color: #ff1493;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>えりのすとれーじ</h1>
        
        <!-- ドラッグ＆ドロップエリア 兼 クリックして選択できるエリア -->
        <div class="drop-zone" id="dropZone">
            <p>ここにZIPファイルをドロップ<br>または</p>
            <button type="button" class="select-btn" id="selectFileBtn">ファイルを選択</button>
            <input type="file" id="fileInput" accept=".zip">
            <p id="fileName" style="margin-top: 10px; color: #ff1493; font-weight: bold;"></p>
        </div>

        <div class="password-container">
            <label for="passwordInput">閲覧パスワード（任意）</label>
            <input type="password" id="passwordInput" placeholder="パスワードを設定する場合入力">
        </div>

        <button id="uploadBtn" disabled>アップロード</button>

        <div id="progressContainer">
            <progress id="progressBar" value="0" max="100"></progress>
            <p id="progressText" style="font-size: 12px; color: #666; margin-top: 5px;">0%</p>
        </div>

        <div id="resultArea"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const passwordInput = document.getElementById('passwordInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const resultArea = document.getElementById('resultArea');

        let selectedFile = null;

        // 「ファイルを選択」ボタンを押したら隠しinputをクリックする
        selectFileBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 領域クリックイベントのバブリング防止
            fileInput.click();
        });

        // エリア自体をクリックしてもファイル選択を開くようにする場合
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // ファイルが選択されたとき
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // ドラッグオーバー時のエフェクト
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = '#ffe4e1';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.backgroundColor = '#fff9fa';
        });

        // ドロップされたとき
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = '#fff9fa';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.zip')) {
                alert('ZIPファイルのみアップロード可能です。');
                return;
            }
            selectedFile = file;
            fileNameDisplay.textContent = `選択中: ${file.name}`;
            uploadBtn.disabled = false;
        }

        // アップロード実行
        uploadBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            const password = passwordInput.value;
            const xhr = new XMLHttpRequest();
            const formData = new FormData();
            formData.append('file', selectedFile);

            xhr.open('POST', '/api/upload', true);
            xhr.setRequestHeader('X-File-Name', encodeURIComponent(selectedFile.name));
            if (password) {
                xhr.setRequestHeader('X-File-Password', password);
            }

            progressContainer.style.display = 'block';
            uploadBtn.disabled = true;
            selectFileBtn.disabled = true;

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.value = percent;
                    progressText.textContent = `${percent}%`;
                }
            });

            xhr.onload = function() {
                if (xhr.status === 200) {
                    const res = JSON.parse(xhr.responseText);
                    if (res.success) {
                        const fullUrl = window.location.origin + res.downloadUrl;
                        resultArea.innerHTML = `アップロード成功！<br><a href="${res.downloadUrl}" target="_blank">${fullUrl}</a>`;
                    }
                } else {
                    try {
                        const errRes = JSON.parse(xhr.responseText);
                        alert(errRes.error || 'アップロードに失敗しました。');
                    } catch {
                        alert('アップロードに失敗しました。');
                    }
                    uploadBtn.disabled = false;
                    selectFileBtn.disabled = false;
                }
                progressContainer.style.display = 'none';
            };

            xhr.onerror = function() {
                alert('通信エラーが発生しました。');
                uploadBtn.disabled = false;
                selectFileBtn.disabled = false;
                progressContainer.style.display = 'none';
            };

            xhr.send(selectedFile);
        });
    </script>
</body>
</html>
